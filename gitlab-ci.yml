variables:
  PROJECT_DIR_DEV: "public_html/dev.exemple.com"
  PROJECT_DIR_PRE_PROD: "public_html/pre.exemple.com"
  PROJECT_DIR_PROD: "public_html/"
  DEPLOYMENT_NUMBER: $CI_PIPELINE_ID
  DEPLOYMENT_PATH: "releases"
  BACKUP_PATH: "backup"
  CURRENT_DIR: "current"
  SHARED_PATH: "shared"
  ENV_URL_DEV: "https://dev.exemple.com"
  ENV_URL_PRE_PROD: "https://pre.exemple.com"
  ENV_URL_PROD: "https://exemple.com"
  php82: "/opt/cpanel/ea-php82/root/usr/bin/php"
  composer: "/opt/cpanel/composer/bin/composer"
  NODE_ENV: "production"

stages:
  - build
  - deploy

# --------------------------------------------------------------
# SSH INIT
# --------------------------------------------------------------
.init_ssh: &init_ssh
  - apt-get update -y --allow-releaseinfo-change
  - apt-get install -y openssh-client zip unzip
  - eval "$(ssh-agent -s)"
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - |
      if [ -f /.dockerenv ]; then
        echo -e "Host *\n\tStrictHostKeyChecking no\n\n" >> ~/.ssh/config
      fi

# --------------------------------------------------------------
# DEPLOY TEMPLATE
# --------------------------------------------------------------
.deploy_template: &deploy_template
  - echo "Début du déploiement sur $ENVIRONMENT"
  - RELEASE_DIR="$(date '+%d%m%Y')-$DEPLOYMENT_NUMBER"
  - zip -r "$CI_COMMIT_SHA.zip" . -x "*.git*" "node_modules/*" ".env" "storage/logs/*" ".npm/*"
  - scp -P "$SSH_PORT" "$CI_COMMIT_SHA.zip" "$SSH_USER@$SSH_HOST:$PROJECT_DIR/$DEPLOYMENT_PATH"
  - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        set -e
        cd $PROJECT_DIR

        if [ -L $CURRENT_DIR ]; then
          cd $CURRENT_DIR
          $php82 artisan down || true
          cd ..
        fi

        if [[ ! -d $DEPLOYMENT_PATH/$RELEASE_DIR ]]; then mkdir -p $DEPLOYMENT_PATH/$RELEASE_DIR; fi
        if [[ ! -d $BACKUP_PATH ]]; then mkdir -p $BACKUP_PATH; fi

        unzip -oq $DEPLOYMENT_PATH/$CI_COMMIT_SHA.zip -d $DEPLOYMENT_PATH/$RELEASE_DIR && rm $DEPLOYMENT_PATH/$CI_COMMIT_SHA.zip

        rm -rf $CURRENT_DIR/vendor
        rm -rf $CURRENT_DIR/node_modules
        rm -rf $CURRENT_DIR/storage
        rm -rf $CURRENT_DIR/.env

        if [ -L $CURRENT_DIR ]; then
          OLD_RELEASE_DIR=\$(readlink -f $CURRENT_DIR)
          mv -f \$OLD_RELEASE_DIR $BACKUP_PATH/\$(basename \$OLD_RELEASE_DIR)-\$(date +%Y%m%d%H%M%S)
        fi

        ls -dt $BACKUP_PATH/* 2>/dev/null | tail -n +4 | xargs rm -rf || true
        rm -f $CURRENT_DIR
        rm -rf $DEPLOYMENT_PATH/$RELEASE_DIR/storage

        ln -nfs ~/$PROJECT_DIR/$SHARED_PATH/.env $DEPLOYMENT_PATH/$RELEASE_DIR/
        ln -nfs ~/$PROJECT_DIR/$SHARED_PATH/.htaccess $DEPLOYMENT_PATH/$RELEASE_DIR/public/
        ln -nfs ~/$PROJECT_DIR/$SHARED_PATH/php.ini $DEPLOYMENT_PATH/$RELEASE_DIR/public/
        ln -nfs ~/$PROJECT_DIR/$SHARED_PATH/storage $DEPLOYMENT_PATH/$RELEASE_DIR/

        ln -nfs $DEPLOYMENT_PATH/$RELEASE_DIR $CURRENT_DIR
        cd $CURRENT_DIR

        $php82 $composer install --no-dev --optimize-autoloader --no-interaction

        $php82 artisan optimize:clear
        $php82 artisan storage:link

        if [ -n \"$MIGRATE_CMD\" ]; then
          $php82 artisan $MIGRATE_CMD
        fi

        sudo supervisorctl restart "laravel-worker-${ENVIRONMENT}:*" || true
        $php82 artisan up

        echo \"Déploiement sur $ENVIRONMENT terminé avec succès\"
      "

# --------------------------------------------------------------
# BUILD ASSETS
# --------------------------------------------------------------
build_assets:
  image: node:22
  stage: build
  script:
    - npm ci --include=dev --no-audit --no-fund
    - npm run build
    - test -f public/build/manifest.json
  artifacts:
    paths:
      - public/build/
    expire_in: 1 hour
  only:
    - main
    - Pre-Production
    - Production

# --------------------------------------------------------------
# DEPLOY DEV
# --------------------------------------------------------------
development:
  image: jakzal/phpqa:php8.2
  stage: deploy
  variables:
    PROJECT_DIR: $PROJECT_DIR_DEV
    ENVIRONMENT: "dev"
    MIGRATE_CMD: "migrate:fresh --seed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: development
    url: $ENV_URL_DEV
  before_script:
    - *init_ssh
  script:
    - *deploy_template
  dependencies:
    - build_assets
  when: always

# --------------------------------------------------------------
# DEPLOY PRE-PROD
# --------------------------------------------------------------
pre-production:
  image: jakzal/phpqa:php8.2
  stage: deploy
  variables:
    PROJECT_DIR: $PROJECT_DIR_PRE_PROD
    ENVIRONMENT: "pre-prod"
    MIGRATE_CMD: "migrate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "Pre-Production"'
  environment:
    name: preproduction
    url: $ENV_URL_PRE_PROD
  before_script:
    - *init_ssh
  script:
    - *deploy_template
  dependencies:
    - build_assets
  when: manual

# --------------------------------------------------------------
# DEPLOY PROD
# --------------------------------------------------------------
production:
  image: jakzal/phpqa:php8.2
  stage: deploy
  variables:
    PROJECT_DIR: $PROJECT_DIR_PROD
    ENVIRONMENT: "prod"
    MIGRATE_CMD: "migrate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "Production"'
  environment:
    name: production
    url: $ENV_URL_PROD
  before_script:
    - *init_ssh
  script:
    - *deploy_template
  dependencies:
    - build_assets
  when: manual
